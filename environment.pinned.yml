# Kp-VirTracer — pinned dependency snapshot (backup / reproducible install)
#
# Snapshot date : 2026-07-14
# Source env    : kpvirtracer @ /root/.local/share/mamba/envs/kpvirtracer
# Platform note : generated on linux-64; recreate with:
#                   mamba env create -f environment.pinned.yml
#                 If solver conflicts arise, fall back to the full freeze:
#                   mamba env create -f environment.lock.yml
#
# This file pins direct / first-party dependencies to the exact versions that
# were validated with the current Kp-VirTracer pipeline. Prefer this file when
# rebuilding the analysis environment after Python or channel upgrades.

name: kpvirtracer
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # --- Core runtimes ---
  - python=3.11.15
  - pip
  - r-base=4.5.3

  # --- Bioinformatics tools (CLI) ---
  - kleborate=3.2.4
  - mob_suite=3.1.9
  - blast=2.17.0
  - fastani=1.34
  - prodigal=2.6.3
  - mash=2.3
  - minimap2=2.30
  - seqkit=2.13.0
  - biopython=1.87

  # --- R package dependencies (KpVirTracer Imports) ---
  - r-cli=3.6.6
  - r-data.table=1.17.8
  - r-dplyr=1.2.1
  - r-fs=1.6.7
  - r-furrr=0.4.0
  - r-future=1.70.0
  - r-glue=1.8.1
  - r-jsonlite=2.0.0
  - r-magrittr=2.0.5
  - r-optparse=1.8.2
  - r-processx=3.8.7
  - r-purrr=1.2.2
  - r-readr=2.2.0
  - r-remotes=2.5.0
  - r-stringr=1.6.0
  - r-tibble=3.3.1
  - r-tidyr=1.3.2
  - r-tidyverse=2.0.0
  - r-yaml=2.3.12
  - bioconductor-biostrings=2.78.0

  # --- Utilities ---
  - git
